<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de ingreso - Casino</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Registro de ingreso</h1>
    <p>Regístrate al llegar y guarda tu QR para el almuerzo</p>
  </div>

  <div id="aviso-demo" class="aviso hidden">Modo demo: los datos quedan solo en este equipo.</div>

  <!-- Paso 1: formulario -->
  <div id="paso-form" class="card">
    <div class="fila dato">
      <div>Fecha: <b id="fecha"></b></div>
      <div>Hora: <b id="hora"></b></div>
    </div>

    <label for="nombre">Nombre y apellido</label>
    <input id="nombre" autocomplete="name" placeholder="Ej: Juan Pérez">

    <label for="area">Área</label>
    <select id="area"><option value="">Selecciona…</option></select>

    <div id="bloque-visita" class="hidden">
      <label for="visita">¿A qué área viene de visita?</label>
      <select id="visita"><option value="">Selecciona…</option></select>
    </div>

    <label>Firma</label>
    <canvas id="firma" class="firma"></canvas>
    <button class="limpiar" id="btn-limpiar" type="button">Borrar firma</button>

    <button class="btn" id="btn-registrar">Registrar ingreso</button>
  </div>

  <!-- Paso 2: QR -->
  <div id="paso-qr" class="card centro hidden">
    <p id="msg-repetido" class="aviso hidden">Ya estabas registrado hoy, este es tu QR.</p>
    <h2 id="qr-nombre" style="margin:0"></h2>
    <p class="dato" id="qr-detalle"></p>
    <div id="qr"></div>
    <p style="font-family:monospace;font-size:18px;letter-spacing:1px;margin:4px 0 10px" id="qr-codigo"></p>
    <p class="dato">Muestra este código en el casino. Vale solo por hoy y para un almuerzo.<br>Haz una captura de pantalla por si acaso.</p>
    <button class="btn" id="btn-descargar">Descargar QR</button>
    <button class="btn sec" id="btn-otro">Registrar a otra persona</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  const $ = id => document.getElementById(id);
  if (!CONFIG.API_URL) $('aviso-demo').classList.remove('hidden');

  CONFIG.AREAS.forEach(a => $('area').add(new Option(a, a)));
  CONFIG.AREAS.filter(a => a !== CONFIG.AREA_VISITANTE).forEach(a => $('visita').add(new Option(a, a)));

  // Si es visitante, mostramos el menú del área que visita
  $('area').onchange = () => {
    const esVisita = $('area').value === CONFIG.AREA_VISITANTE;
    $('bloque-visita').classList.toggle('hidden', !esVisita);
    if (!esVisita) $('visita').value = '';
  };

  function reloj() {
    $('fecha').textContent = new Date().toLocaleDateString('es-CL');
    $('hora').textContent = horaActual();
  }
  reloj(); setInterval(reloj, 15000);

  // ---- Firma con el dedo o el mouse ----
  const canvas = $('firma');
  const ctx = canvas.getContext('2d');
  let dibujando = false, hayFirma = false;

  function ajustarCanvas() {
    const r = canvas.getBoundingClientRect();
    if (!r.width) return;   // formulario oculto (se está mostrando el QR)
    // En el celular el teclado o la barra del navegador disparan "resize";
    // si el ancho no cambió no tocamos nada para no borrar la firma
    if (Math.round(r.width) === canvas.width && Math.round(r.height) === canvas.height) return;

    // Al girar el celular cambia el ancho: copiamos la firma y la redibujamos al nuevo tamaño
    let copia = null;
    if (hayFirma) {
      copia = document.createElement('canvas');
      copia.width = canvas.width;
      copia.height = canvas.height;
      copia.getContext('2d').drawImage(canvas, 0, 0);
    }
    canvas.width = Math.round(r.width);
    canvas.height = Math.round(r.height);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#111';
    if (copia) ctx.drawImage(copia, 0, 0, canvas.width, canvas.height);
  }
  ajustarCanvas();
  window.addEventListener('resize', ajustarCanvas);
  // Algunos celulares avisan el giro antes de terminar de acomodar la pantalla
  window.addEventListener('orientationchange', () => setTimeout(ajustarCanvas, 300));

  function punto(e) {
    const r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  canvas.addEventListener('pointerdown', e => {
    dibujando = true;
    canvas.setPointerCapture(e.pointerId);
    ctx.beginPath();
    ctx.moveTo(...punto(e));
  });
  canvas.addEventListener('pointermove', e => {
    if (!dibujando) return;
    ctx.lineTo(...punto(e));
    ctx.stroke();
    hayFirma = true;
  });
  ['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, () => dibujando = false));
  $('btn-limpiar').onclick = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hayFirma = false;
  };

  // Achica la firma para no mandar imágenes pesadas
  function firmaLiviana() {
    const c = document.createElement('canvas');
    c.width = 300; c.height = Math.round(300 * canvas.height / canvas.width);
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(canvas, 0, 0, c.width, c.height);
    return c.toDataURL('image/png');
  }

  // ---- Registrar ----
  $('btn-registrar').onclick = async () => {
    const nombre = $('nombre').value.trim();
    const area = $('area').value;
    if (nombre.length < 3) return alert('Escribe tu nombre completo');
    if (!area) return alert('Selecciona tu área');
    const visita = area === CONFIG.AREA_VISITANTE ? $('visita').value : '';
    if (area === CONFIG.AREA_VISITANTE && !visita) return alert('Selecciona el área que visitas');
    if (!hayFirma) return alert('Falta la firma');

    const btn = $('btn-registrar');
    btn.disabled = true; btn.textContent = 'Registrando…';
    try {
      const r = await api('registrar', { nombre, area, visita, firma: firmaLiviana() });
      if (!r.ok) throw new Error(r.error);
      try { localStorage.setItem('mi_qr', JSON.stringify(r)); } catch {}
      mostrarQR(r);
    } catch (err) {
      alert('No se pudo registrar: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Registrar ingreso';
    }
  };

  function mostrarQR(r) {
    $('paso-form').classList.add('hidden');
    $('paso-qr').classList.remove('hidden');
    $('msg-repetido').classList.toggle('hidden', !r.repetido);
    $('qr-nombre').textContent = r.nombre;
    const areaTxt = r.visita ? `${r.area} → ${r.visita}` : r.area;
    $('qr-detalle').textContent = `${areaTxt} · ingreso ${r.hora} · ${r.fecha}`;
    $('qr-codigo').textContent = r.id;
    $('qr').innerHTML = '';
    new QRCode($('qr'), { text: r.id, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  }

  $('btn-descargar').onclick = () => {
    const img = $('qr').querySelector('canvas');
    const a = document.createElement('a');
    a.href = img.toDataURL('image/png');
    a.download = `QR-almuerzo-${$('qr-nombre').textContent.replace(/\s+/g, '_')}.png`;
    a.click();
  };

  $('btn-otro').onclick = () => {
    try { localStorage.removeItem('mi_qr'); } catch {}
    $('nombre').value = ''; $('area').value = ''; $('visita').value = '';
    $('bloque-visita').classList.add('hidden');
    ctx.clearRect(0, 0, canvas.width, canvas.height); hayFirma = false;
    $('paso-qr').classList.add('hidden');
    $('paso-form').classList.remove('hidden');
  };

  // Si ya se registró hoy en este celular, mostrar su QR directo
  try {
    const guardado = JSON.parse(localStorage.getItem('mi_qr') || 'null');
    if (guardado && guardado.fecha === hoyISO()) mostrarQR(guardado);
  } catch {}
</script>
</body>
</html>
