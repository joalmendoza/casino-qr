<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte diario - Casino</title>
  <link rel="stylesheet" href="css/estilos.css?v=5">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Reporte del día</h1>
    <p>Ingresos y almuerzos registrados hoy</p>
  </div>

  <div id="paso-pin" class="card">
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric">
    <button class="btn" id="btn-ver">Ver reporte</button>
  </div>

  <div id="aviso-licencia" class="hidden"></div>

  <div id="paso-datos" class="hidden">
    <div class="card">
      <label for="tope">Hora tope de registro de personas</label>
      <p class="dato" style="margin:0 0 8px">Después de esta hora ya no se aceptan registros nuevos. Hoy: <b id="tope-actual">…</b></p>
      <div class="fila">
        <input id="tope" type="time" step="60">
        <button class="btn" id="btn-tope" style="flex:0 0 110px;margin-bottom:14px">Guardar</button>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><b id="k-ing">0</b><span>Ingresaron</span></div>
      <div class="kpi"><b id="k-alm">0</b><span>Almorzaron</span></div>
      <div class="kpi"><b id="k-pen">0</b><span>Pendientes</span></div>
    </div>
    <div class="card" style="overflow-x:auto">
      <table>
        <thead><tr><th>Nombre</th><th>Cédula</th><th>Área</th><th>Ingreso</th><th>Almuerzo</th></tr></thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
    <button class="btn" id="btn-csv">Descargar el día (Excel)</button>
    <div class="card" style="margin-top:12px">
      <label for="semana">Reporte semanal (lunes a domingo)</label>
      <div class="fila">
        <select id="semana">
          <option value="actual">Esta semana</option>
          <option value="anterior">Semana pasada</option>
        </select>
        <button class="btn" id="btn-semana" style="flex:0 0 120px;margin-bottom:14px">Descargar</button>
      </div>
    </div>
    <button class="btn sec" id="btn-refrescar">Actualizar</button>
    <label class="check" style="margin-top:12px">
      <input type="checkbox" id="auto" checked>
      <span>Actualizar solo cada 30 segundos <span class="dato" id="ultima"></span></span>
    </label>
  </div>
</div>

<script src="js/config.js?v=5"></script>
<script src="js/api.js?v=5"></script>
<script>
  const $ = id => document.getElementById(id);
  let pin = '', filas = [];

  async function cargar() {
    const r = await api('resumen', { pin });
    if (!r.ok) { alert(r.error); return false; }
    mostrarLicencia(r.licencia, $('aviso-licencia'));
    $('ultima').textContent = '· última: ' + new Date().toTimeString().slice(0, 8);
    filas = r.filas;
    const alm = filas.filter(f => f.almorzo).length;
    $('k-ing').textContent = filas.length;
    $('k-alm').textContent = alm;
    $('k-pen').textContent = filas.length - alm;
    const tb = $('tabla');
    tb.innerHTML = '';
    filas.forEach(f => {
      const tr = tb.insertRow();
      [f.nombre, f.cedula, f.visita ? `${f.area} → ${f.visita}` : f.area, f.hora, f.almorzo ? f.horaAlmuerzo : '—'].forEach(v => tr.insertCell().textContent = v);
    });
    return true;
  }

  async function cargarTope() {
    const r = await api('config');
    if (r.ok) {
      $('tope').value = r.horaTope;
      $('tope-actual').textContent = hora12(r.horaTope) + (r.abierto ? ' (abierto)' : ' (cerrado)');
    }
  }

  $('btn-tope').onclick = async () => {
    const v = $('tope').value;
    if (!v) return alert('Elige una hora');
    const btn = $('btn-tope');
    btn.disabled = true;
    try {
      const r = await api('guardarTope', { pin, horaTope: v });
      if (!r.ok) return alert(r.error);
      await cargarTope();
      alert('Listo. El registro queda abierto hasta las ' + hora12(r.horaTope));
    } catch (err) {
      alert('No se pudo guardar: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  };

  $('btn-ver').onclick = async () => {
    pin = $('pin').value.trim();
    if (await cargar()) {
      cargarTope();
      $('paso-pin').classList.add('hidden');
      $('paso-datos').classList.remove('hidden');
    }
  };
  $('btn-refrescar').onclick = cargar;

  // Actualización automática mientras el reporte está abierto (sirve para tenerlo en pantalla en portería o en el casino)
  setInterval(() => {
    if (pin && $('auto').checked && !document.hidden && !$('paso-datos').classList.contains('hidden')) cargar();
  }, 30000);

  // CSV con ; y BOM para que Excel lo abra directo con tildes y columnas bien separadas
  function descargarCSV(lista, nombreArchivo) {
    const cab = 'ID;Fecha;Nombre;Area;HoraIngreso;Almorzo;HoraAlmuerzo;AreaVisita;Cedula';
    const lineas = lista.map(f => [f.id, f.fecha, f.nombre, f.area, f.hora, f.almorzo ? 'SI' : 'NO', f.horaAlmuerzo, f.visita, f.cedula]
      .map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';'));
    const blob = new Blob(['\ufeff' + [cab, ...lineas].join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo;
    a.click();
  }

  $('btn-csv').onclick = () => descargarCSV(filas, `casino-${hoyISO()}.csv`);

  $('btn-semana').onclick = async () => {
    const btn = $('btn-semana');
    btn.disabled = true;
    try {
      const r = await api('resumenSemana', { pin, semana: $('semana').value });
      if (!r.ok) return alert(r.error);
      if (!r.filas.length) return alert('No hay registros en esa semana');
      descargarCSV(r.filas, `casino-semana-${r.desde}-al-${r.hasta}.csv`);
    } catch (err) {
      alert('No se pudo descargar: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
